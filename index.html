<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kestrel Bank – Online Banking</title>
<style>
:root{--bg:#EEF2F5;--surface:#fff;--ink:#10263A;--muted:#5B6B7A;--line:#D8E0E7;--brand:#12384F;--accent:#E0A030;--pos:#1B7F5A;--neg:#B3342F}
@media (prefers-color-scheme:dark){:root{--bg:#0C1822;--surface:#13242F;--ink:#E8EEF3;--muted:#92A3B2;--line:#25394A;--brand:#1C4B66;--pos:#4FC59A;--neg:#F0827D}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 16px;font-weight:700;font-size:1.25rem}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto}
.btn:disabled{opacity:.6}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:26px 22px;margin-bottom:16px}
.amt{font-size:clamp(2.2rem,9vw,3.2rem);font-weight:700;margin:4px 0 0;line-height:1.1}
h1{font-size:1.6rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 12px}
label{display:block;font-size:.9rem;font-weight:500;margin:12px 0 4px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.err{color:var(--neg);font-size:.9rem;min-height:1.4em;margin:8px 0}
.note{color:var(--muted);font-size:.85rem}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
@media (prefers-color-scheme:dark){.link{color:var(--accent)}}
.tx{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}.tx span{display:block;color:var(--muted);font-size:.85rem}
.pos{color:var(--pos);font-weight:600;white-space:nowrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><span>Kestrel Bank</span><button class="btn ghost" id="out" hidden>Sign out</button></header>

<main id="reg" class="card">
<h1>Open an account</h1>
<label for="rn">Full name</label><input id="rn" autocomplete="name">
<label for="re">Email address</label><input id="re" type="email" autocomplete="email">
<label for="rp">Password (8+ characters)</label><input id="rp" type="password" autocomplete="new-password">
<p class="err" id="rerr" role="alert"></p>
<button class="btn" id="rbtn">Create account</button>
<p class="note">Already registered? <button class="link" id="goin">Sign in</button></p>
</main>

<main id="login" class="card" hidden>
<h1>Sign in</h1>
<label for="le">Email address</label><input id="le" type="email" autocomplete="email">
<label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password">
<p class="err" id="lerr" role="alert"></p>
<button class="btn" id="lbtn">Sign in</button>
<p class="note">New here? <button class="link" id="goreg">Create an account</button></p>
</main>

<main id="app" hidden>
<section class="hero"><span id="hi"></span><p class="amt" id="bal"></p><span>Available balance</span></section>
<section class="card"><h2>Credit your account</h2>
<label for="amt">Amount (USD)</label><input id="amt" inputmode="decimal" placeholder="0.00">
<label for="memo">Note (optional)</label><input id="memo" maxlength="40">
<p class="err" id="terr" role="alert"></p>
<button class="btn" id="add">Add money</button>
<p class="note" id="sent"></p>
</section>
<section class="card"><h2>Recent activity</h2><div id="txs"></div></section>
</main>
</div>
<script>
// IMPORTANT: change this to your deployed backend address, with no trailing slash.
var API="https://geegpay-backend.onrender.com";
var token=null;
var $=function(i){return document.getElementById(i)};
var fmt=function(n){return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})};
function view(n){["reg","login","app"].forEach(function(k){$(k).hidden=k!==n});$("out").hidden=n!=="app"}
async function call(path,method,body){
  var h={"Content-Type":"application/json"};if(token)h.Authorization="Bearer "+token;
  var r;
  try{r=await fetch(API+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined})}
  catch(e){throw new Error("Can’t reach the server. Please try again.")}
  var j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||"Something went wrong.");
  return j}
async function load(){
  var m=await call("/api/me","GET");
  $("hi").textContent="Welcome, "+m.name.split(" ")[0];
  $("bal").textContent=fmt(m.balance);
  var t=$("txs");t.innerHTML="";
  if(!m.tx.length)t.innerHTML="<p class='note'>No activity yet.</p>";
  m.tx.forEach(function(x){
    var d=document.createElement("div");d.className="tx";
    var l=document.createElement("div");l.textContent="Credit"+(x.note?" – "+x.note:"");
    var s=document.createElement("span");s.textContent=new Date(x.created_at.replace(" ","T")+"Z").toLocaleDateString();l.appendChild(s);
    var r=document.createElement("div");r.className="pos";r.textContent="+"+fmt(x.amount_cents/100);
    d.appendChild(l);d.appendChild(r);t.appendChild(d)});
  view("app")}
async function run(btn,errEl,fn){
  btn.disabled=true;errEl.textContent="";
  try{await fn()}catch(e){errEl.textContent=e.message}
  btn.disabled=false}
$("goin").onclick=function(){view("login")};
$("goreg").onclick=function(){view("reg")};
$("rbtn").onclick=function(){run($("rbtn"),$("rerr"),async function(){
  var r=await call("/api/register","POST",{name:$("rn").value,email:$("re").value,password:$("rp").value});
  token=r.token;$("rp").value="";await load()})};
$("lbtn").onclick=function(){run($("lbtn"),$("lerr"),async function(){
  var r=await call("/api/login","POST",{email:$("le").value,password:$("lp").value});
  token=r.token;$("lp").value="";await load()})};
$("add").onclick=function(){run($("add"),$("terr"),async function(){
  await call("/api/credit","POST",{amount:$("amt").value,note:$("memo").value});
  $("amt").value="";$("memo").value="";$("sent").textContent="Credited. An email alert with your new balance has been sent.";
  await load()})};
$("out").onclick=function(){token=null;view("login")};
</script>
</body>
</html>
